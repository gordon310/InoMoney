<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- 浏览器标签页标题 -->
    <title>INO赚大钱 | Smart Money Tracker</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-main: #333333;
            --text-light: #888888;
            --border-color: #eeeeee;
            --accent-red: #E53935;
            --accent-green: #43A047;
            --card-bg: #fafafa;
            --font-stack: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: var(--font-stack);
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
            font-size: 14px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 顶部导航 */
        header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            z-index: 10;
        }

        .logo { font-size: 18px; font-weight: 800; letter-spacing: -0.5px; color: var(--text-main); }
        .date-tag { font-size: 11px; color: var(--text-light); background: #f0f0f0; padding: 2px 8px; border-radius: 4px; }

        /* 机构选择器 (横向滚动) */
        .institution-scroll {
            display: flex;
            overflow-x: auto;
            padding: 12px 20px;
            gap: 8px;
            background: white;
            border-bottom: 1px solid var(--border-color);
            scrollbar-width: none; /* Firefox */
        }
        .institution-scroll::-webkit-scrollbar { display: none; } /* Chrome/Safari */

        .inst-chip {
            flex-shrink: 0;
            padding: 6px 14px;
            background: #f5f5f5;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            color: #666;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .inst-chip.active {
            background: var(--text-main);
            color: white;
        }

        /* 主内容区 */
        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            -webkit-overflow-scrolling: touch;
        }

        /* 概览信息条 */
        .info-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 12px;
            color: var(--text-light);
        }
        .info-bar span strong { color: var(--text-main); font-size: 14px; display: block; margin-top: 2px;}

        /* 卡片网格布局 */
        .card-grid {
            display: grid;
            grid-template-columns: 1fr; /* 手机默认单列 */
            gap: 12px;
        }

        /* 桌面端自适应多列 */
        @media (min-width: 640px) { .card-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (min-width: 1024px) { .card-grid { grid-template-columns: repeat(3, 1fr); } }

        /* 单个卡片样式 */
        .stock-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.1s;
        }

        .stock-card:active { transform: scale(0.98); background: #f0f0f0; }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .ticker { font-size: 18px; font-weight: 700; letter-spacing: -0.5px; }
        .company-name { font-size: 12px; color: var(--text-light); margin-top: 2px; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;}

        .change-badge {
            font-size: 13px;
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 6px;
            min-width: 60px;
            text-align: center;
        }

        .up { color: var(--accent-green); background: rgba(67, 160, 71, 0.1); }
        .down { color: var(--accent-red); background: rgba(229, 57, 53, 0.1); }
        .flat { color: var(--text-light); background: #eee; }

        .card-footer {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-light);
            border-top: 1px solid var(--border-color);
            padding-top: 10px;
            margin-top: auto;
        }

            margin-top: 30px;
            padding-top: 20px;
