<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- 浏览器标签页标题 -->
    <title>INO赚大钱 | Smart Money Tracker</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-main: #333333;
            --text-light: #888888;
            --border-color: #eeeeee;
            --accent-red: #E53935;
            --accent-green: #43A047;
            --card-bg: #fafafa;
            --font-stack: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: var(--font-stack);
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
            font-size: 14px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 顶部导航 */
        header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            z-index: 10;
        }

        .logo { font-size: 18px; font-weight: 800; letter-spacing: -0.5px; color: var(--text-main); }
        .date-tag { font-size: 11px; color: var(--text-light); background: #f0f0f0; padding: 2px 8px; border-radius: 4px; }

        /* 机构选择器 (横向滚动) */
        .institution-scroll {
            display: flex;
            overflow-x: auto;
            padding: 12px 20px;
            gap: 8px;
            background: white;
            border-bottom: 1px solid var(--border-color);
            scrollbar-width: none; /* Firefox */
        }
        .institution-scroll::-webkit-scrollbar { display: none; } /* Chrome/Safari */

        .inst-chip {
            flex-shrink: 0;
            padding: 6px 14px;
            background: #f5f5f5;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            color: #666;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .inst-chip.active {
            background: var(--text-main);
            color: white;
        }

        /* 主内容区 */
        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            -webkit-overflow-scrolling: touch;
        }

        /* 概览信息条 */
        .info-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 12px;
            color: var(--text-light);
        }
        .info-bar span strong { color: var(--text-main); font-size: 14px; display: block; margin-top: 2px;}

        /* 卡片网格布局 */
        .card-grid {
            display: grid;
            grid-template-columns: 1fr; /* 手机默认单列 */
            gap: 12px;
        }

        /* 桌面端自适应多列 */
        @media (min-width: 640px) { .card-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (min-width: 1024px) { .card-grid { grid-template-columns: repeat(3, 1fr); } }

        /* 单个卡片样式 */
        .stock-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.1s;
        }

        .stock-card:active { transform: scale(0.98); background: #f0f0f0; }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .ticker { font-size: 18px; font-weight: 700; letter-spacing: -0.5px; }
        .company-name { font-size: 12px; color: var(--text-light); margin-top: 2px; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;}

        .change-badge {
            font-size: 13px;
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 6px;
            min-width: 60px;
            text-align: center;
        }

        .up { color: var(--accent-green); background: rgba(67, 160, 71, 0.1); }
        .down { color: var(--accent-red); background: rgba(229, 57, 53, 0.1); }
        .flat { color: var(--text-light); background: #eee; }

        .card-footer {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-light);
            border-top: 1px solid var(--border-color);
            padding-top: 10px;
            margin-top: auto;
        }

        /* 底部共识区 */
        .consensus {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid var(--text-main);
        }
        .consensus h3 { font-size: 14px; margin-bottom: 12px; }
        .tags { display: flex; flex-wrap: wrap; gap: 8px; }
        .tag { font-size: 12px; padding: 6px 12px; background: #f0f0f0; border-radius: 4px; font-weight: 500;}

    </style>
</head>
<body>

    <header>
        <!-- 页面顶部 Logo -->
        <div class="logo">INO赚大钱</div>
        <div class="date-tag">2023 Q4</div>
    </header>

    <!-- 横向滚动的机构选择器 -->
    <div class="institution-scroll" id="instScroll">
        <!-- JS 生成 -->
    </div>

    <div class="content-area">
        <!-- 机构元数据 -->
        <div class="info-bar">
            <div>Manager<strong id="mgrName">Warren Buffett</strong></div>
            <div style="text-align:right;">Style<strong id="mgrStyle">Value</strong></div>
        </div>

        <!-- 持仓卡片容器 -->
        <div class="card-grid" id="cardGrid">
            <!-- JS 生成 -->
        </div>

        <!-- 市场共识 -->
        <div class="consensus">
            <h3>🔥 聪明钱共识</h3>
            <div class="tags">
                <span class="tag">NVDA +15%</span>
                <span class="tag">MSFT +8%</span>
                <span class="tag">AMZN +5%</span>
                <span class="tag">LLY +12%</span>
                <span class="tag">META +20%</span>
            </div>
        </div>
    </div>

<script>
    // 模拟数据
    const data = [
        {
            id: 'brk', name: 'Berkshire', mgr: 'Warren Buffett', style: 'Value',
            holdings: [
                { t: 'AAPL', n: 'Apple Inc.', v: '174.0B', p: '49.2%', c: -10.5 },
                { t: 'BAC', n: 'Bank of America', v: '32.5B', p: '9.2%', c: 0 },
                { t: 'AXP', n: 'American Express', v: '24.8B', p: '7.0%', c: 0 },
                { t: 'KO', n: 'Coca-Cola Co', v: '23.5B', p: '6.6%', c: 0 },
                { t: 'CVX', n: 'Chevron Corp', v: '19.2B', p: '5.4%', c: 2.1 },
                { t: 'OXY', n: 'Occidental Petroleum', v: '11.8B', p: '3.3%', c: 5.5 }
            ]
        },
        {
            id: 'ark', name: 'ARK Invest', mgr: 'Cathie Wood', style: 'Disruptive',
            holdings: [
                { t: 'TSLA', n: 'Tesla Inc', v: '1.2B', p: '14.1%', c: 5.5 },
                { t: 'COIN', n: 'Coinbase Global', v: '950M', p: '11.2%', c: 12.0 },
                { t: 'ROKU', n: 'Roku Inc', v: '600M', p: '7.1%', c: -2.3 },
                { t: 'SHOP', n: 'Shopify Inc', v: '550M', p: '6.5%', c: 1.2 },
                { t: 'ZM', n: 'Zoom Video', v: '400M', p: '4.7%', c: -5.0 }
            ]
        },
        {
            id: 'ps', name: 'Pershing Sq', mgr: 'Bill Ackman', style: 'Activist',
            holdings: [
                { t: 'HLT', n: 'Hilton Worldwide', v: '4.5B', p: '20.5%', c: 0 },
                { t: 'LOW', n: "Lowe's Companies", v: '3.2B', p: '14.5%', c: 1.5 },
                { t: 'SBUX', n: 'Starbucks Corp', v: '2.8B', p: '12.7%', c: -3.0 },
                { t: 'CMG', n: 'Chipotle Mexican', v: '2.1B', p: '9.5%', c: 4.2 }
            ]
        }
    ];

    let currentIdx = 0;

    // 渲染机构选择器
    const scrollContainer = document.getElementById('instScroll');
    data.forEach((inst, idx) => {
        const chip = document.createElement('div');
        chip.className = `inst-chip ${idx === 0 ? 'active' : ''}`;
        chip.innerText = inst.name;
        chip.onclick = () => switchInstitution(idx);
        scrollContainer.appendChild(chip);
    });

    function switchInstitution(idx) {
        currentIdx = idx;
        // 更新按钮状态
        document.querySelectorAll('.inst-chip').forEach((el, i) => {
            el.classList.toggle('active', i === idx);
        });
        renderView();
    }

    function renderView() {
        const inst = data[currentIdx];
        
        // 更新元数据
        document.getElementById('mgrName').innerText = inst.mgr;
        document.getElementById('mgrStyle').innerText = inst.style;

        // 渲染卡片
        const grid = document.getElementById('cardGrid');
        grid.innerHTML = ''; // 清空

        inst.holdings.forEach(stock => {
            const changeClass = stock.c > 0 ? 'up' : (stock.c < 0 ? 'down' : 'flat');
            const changeText = stock.c > 0 ? `+${stock.c}%` : `${stock.c}%`;

            const card = document.createElement('div');
            card.className = 'stock-card';
            card.innerHTML = `
                <div class="card-header">
                    <div>
                        <div class="ticker">${stock.t}</div>
                        <div class="company-name">${stock.n}</div>
                    </div>
                    <div class="change-badge ${changeClass}">${changeText}</div>
                </div>
                <div class="card-footer">
                    <span>市值 ${stock.v}</span>
                    <span>占比 ${stock.p}</span>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    // 初始化
    renderView();
</script>
</body>
</html>
