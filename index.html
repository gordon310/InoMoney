<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- 浏览器标签页标题 -->
    <title>INO赚大钱 | Smart Money Tracker</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-main: #333333;
            --text-light: #888888;
            --border-color: #eeeeee;
            --accent-red: #E53935;
            --accent-green: #43A047;
            --card-bg: #fafafa;
            --font-stack: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: var(--font-stack);
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
            font-size: 14px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 顶部导航 */
        header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            z-index: 10;
        }

        .logo { font-size: 18px; font-weight: 800; letter-spacing: -0.5px; color: var(--text-main); }
        .date-tag { font-size: 11px; color: var(--text-light); background: #f0f0f0; padding: 2px 8px; border-radius: 4px; }

        /* 机构选择器 (横向滚动) */
        .institution-scroll {
            display: flex;
            overflow-x: auto;
            padding: 12px 20px;
            gap: 8px;
            background: white;
            border-bottom: 1px solid var(--border-color);
            scrollbar-width: none; /* Firefox */
        }
        .institution-scroll::-webkit-scrollbar { display: none; } /* Chrome/Safari */

        .inst-chip {
            flex-shrink: 0;
            padding: 6px 14px;
            background: #f5f5f5;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            color: #666;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .inst-chip.active {
            background: var(--text-main);
            color: white;
        }

        /* 主内容区 */
        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            -webkit-overflow-scrolling: touch;
        }

        /* 概览信息条 */
        .info-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 12px;
            color: var(--text-light);
        }
        .info-bar span strong { color: var(--text-main); font-size: 14px; display: block; margin-top: 2px;}

        /* 卡片网格布局 */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr)); /* 手机端两列 */
            gap: 8px;
        }

        /* 桌面端自适应多列 */
        @media (min-width: 640px) { .card-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; } }
        @media (min-width: 1024px) { .card-grid { grid-template-columns: repeat(3, 1fr); } }

        /* 单个卡片样式 */
        .stock-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.1s;
        }

        .stock-card:active { transform: scale(0.98); background: #f0f0f0; }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .ticker { font-size: 15px; font-weight: 700; letter-spacing: -0.5px; }
        .company-name { font-size: 10px; color: var(--text-light); margin-top: 2px; max-width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;}

        .change-badge {
            font-size: 10px;
            font-weight: 600;
            padding: 3px 5px;
            border-radius: 6px;
            min-width: 42px;
            text-align: center;
        }

        .up { color: var(--accent-green); background: rgba(67, 160, 71, 0.1); }
        .down { color: var(--accent-red); background: rgba(229, 57, 53, 0.1); }
        .flat { color: var(--text-light); background: #eee; }

        .card-footer {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: var(--text-light);
            border-top: 1px solid var(--border-color);
            padding-top: 8px;
            margin-top: auto;
        }

        /* 底部共识区 */
        .consensus {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid var(--text-main);
        }
        .consensus h3 { font-size: 14px; margin-bottom: 12px; }
        .tags { display: flex; flex-wrap: wrap; gap: 8px; }
        .tag { font-size: 12px; padding: 6px 12px; background: #f0f0f0; border-radius: 4px; font-weight: 500;}
        .status { color: var(--text-light); font-size: 13px; padding: 20px 0; }
        .error { color: var(--accent-red); background: rgba(229, 57, 53, 0.08); border-radius: 8px; padding: 12px; }

        /* 全球资产管理机构目录 */
        .directory-section {
            margin-top: 34px;
            padding-top: 20px;
            border-top: 2px solid var(--text-main);
        }
        .directory-heading {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
            margin-bottom: 12px;
        }
        .directory-heading h3 { font-size: 15px; }
        .directory-heading p { color: var(--text-light); font-size: 12px; margin-top: 3px; }
        .directory-total { color: var(--text-light); font-size: 11px; text-align: right; white-space: nowrap; }
        .directory-scroll { overflow-x: auto; border: 1px solid var(--border-color); border-radius: 10px; }
        .directory-table { width: 100%; min-width: 680px; border-collapse: collapse; font-size: 12px; }
        .directory-table th,
        .directory-table td { padding: 10px 12px; border-bottom: 1px solid var(--border-color); text-align: left; vertical-align: top; }
        .directory-table th { color: var(--text-light); font-size: 11px; font-weight: 500; background: #fafafa; white-space: nowrap; }
        .directory-table tr:last-child td { border-bottom: 0; }
        .directory-rank { color: var(--text-light); width: 46px; }
        .directory-name-zh { display: block; font-weight: 600; color: var(--text-main); }
        .directory-name-en { display: block; color: var(--text-light); font-size: 11px; margin-top: 2px; }
        .directory-region { color: #666; white-space: nowrap; }
        .directory-aum { white-space: nowrap; font-variant-numeric: tabular-nums; }
        .data-badge { display: inline-block; padding: 3px 7px; border-radius: 4px; font-size: 10px; white-space: nowrap; }
        .data-badge.available { color: var(--accent-green); background: rgba(67, 160, 71, 0.1); }
        .data-badge.unavailable { color: var(--text-light); background: #f0f0f0; }
        .directory-source { color: var(--text-light); font-size: 11px; margin-top: 10px; }
        .directory-source a { color: inherit; }
        .holding-button {
            display: block;
            margin-top: 8px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            padding: 4px 8px;
            color: var(--text-main);
            background: white;
            font: inherit;
            font-size: 11px;
            cursor: pointer;
        }
        .holding-button:hover { border-color: #bbb; background: #fafafa; }
        .holding-button:disabled { color: var(--text-light); cursor: wait; }
        .holdings-detail {
            margin-top: 18px;
            padding: 16px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background: #fafafa;
        }
        .holdings-detail[hidden] { display: none; }
        .holdings-detail-heading {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            align-items: flex-start;
            margin-bottom: 12px;
        }
        .holdings-detail-heading h3 { font-size: 14px; }
        .holdings-detail-heading p { color: var(--text-light); font-size: 11px; margin-top: 3px; }
        .detail-close { border: 0; color: var(--text-light); background: transparent; cursor: pointer; font: inherit; font-size: 12px; }
        .holdings-table { width: 100%; border-collapse: collapse; font-size: 12px; }
        .holdings-table th,
        .holdings-table td { padding: 8px 6px; border-bottom: 1px solid var(--border-color); text-align: left; }
        .holdings-table th { color: var(--text-light); font-size: 11px; font-weight: 500; }
        .holdings-table td:last-child,
        .holdings-table th:last-child { text-align: right; }
        .holdings-table tr:last-child td { border-bottom: 0; }

        @media (min-width: 640px) {
            .stock-card { padding: 16px; border-radius: 12px; }
            .card-header { margin-bottom: 12px; }
            .ticker { font-size: 18px; }
            .company-name { font-size: 12px; max-width: 140px; }
            .change-badge { font-size: 13px; padding: 4px 8px; min-width: 60px; }
            .card-footer { font-size: 11px; padding-top: 10px; }
        }

        @media (max-width: 639px) {
            .directory-heading { display: block; }
            .directory-total { margin-top: 6px; text-align: left; }
        }

    </style>
</head>
<body>

    <header>
        <!-- 页面顶部 Logo -->
        <div class="logo">INO赚大钱</div>
        <div class="date-tag" id="filingDate">SEC EDGAR</div>
    </header>

    <!-- 横向滚动的机构选择器 -->
    <div class="institution-scroll" id="instScroll">
        <!-- JS 生成 -->
    </div>

    <div class="content-area">
        <!-- 机构元数据 -->
        <div class="info-bar">
            <div>Manager<strong id="mgrName">Warren Buffett</strong></div>
            <div style="text-align:right;">Style<strong id="mgrStyle">Value</strong></div>
        </div>

        <!-- 持仓卡片容器 -->
        <div class="card-grid" id="cardGrid">
            <!-- JS 生成 -->
        </div>

        <!-- 市场共识 -->
        <div class="consensus">
            <h3>🔥 聪明钱共识</h3>
            <div class="tags">
                <span class="tag">SEC 13F</span>
                <span class="tag">最新已披露</span>
                <span class="tag">季度持仓</span>
            </div>
        </div>

        <section class="holdings-detail" id="holdingsDetail" hidden aria-live="polite">
            <div class="holdings-detail-heading">
                <div>
                    <h3 id="holdingsTitle">机构持仓</h3>
                    <p id="holdingsMeta"></p>
                </div>
                <button class="detail-close" id="holdingsClose" type="button">关闭</button>
            </div>
            <div id="holdingsDetailBody"></div>
        </section>

        <!-- 全球资产管理机构 Top 100 -->
        <section class="directory-section" aria-labelledby="top100Title">
            <div class="directory-heading">
                <div>
                    <h3 id="top100Title">全球资产管理机构 Top 100</h3>
                    <p>中英文名称、所在地区与公开管理规模</p>
                </div>
                <div class="directory-total" id="top100Total">正在读取榜单...</div>
            </div>
            <div class="directory-scroll" id="top100List">
                <div class="status">正在读取全球资产管理机构榜单...</div>
            </div>
            <p class="directory-source" id="top100Source"></p>
        </section>
    </div>

<script>
    const API_ENDPOINT = new URLSearchParams(window.location.search).get('api')
        || 'https://inomoney-sec-api.inomoney.workers.dev';
    let data = [];
    let top100 = [];

    let currentIdx = 0;
    const scrollContainer = document.getElementById('instScroll');
    const grid = document.getElementById('cardGrid');
    const top100List = document.getElementById('top100List');
    const holdingsDetail = document.getElementById('holdingsDetail');
    const holdingsTitle = document.getElementById('holdingsTitle');
    const holdingsMeta = document.getElementById('holdingsMeta');
    const holdingsDetailBody = document.getElementById('holdingsDetailBody');
    document.getElementById('holdingsClose').onclick = () => { holdingsDetail.hidden = true; };

    async function loadData() {
        grid.innerHTML = '<div class="status">正在读取 SEC EDGAR 最新 13F 数据...</div>';

        try {
            if (API_ENDPOINT.includes('YOUR_WORKERS_SUBDOMAIN')) {
                throw new Error('请先把 API_ENDPOINT 改成你部署后的 Cloudflare Worker URL。');
            }

            const response = await fetch(`${API_ENDPOINT}/holdings`);
            if (!response.ok) {
                throw new Error(`SEC 数据接口返回 ${response.status}`);
            }

            const payload = await response.json();
            data = payload.institutions || [];
            top100 = Array.isArray(payload.top100) ? payload.top100 : [];

            if (!data.length && !top100.length) {
                throw new Error('数据接口没有返回机构或资产管理榜单。');
            }

            if (data.length) {
                renderInstitutionSelector();
                renderView();
            } else {
                grid.innerHTML = '<div class="status">当前仅返回资产管理机构目录，SEC 持仓尚未配置。</div>';
                document.getElementById('mgrName').innerText = '目录模式';
                document.getElementById('mgrStyle').innerText = 'Top 100';
            }
            renderTop100Directory(payload.top100Meta);
        } catch (error) {
            grid.innerHTML = `<div class="status error">${error.message}</div>`;
            top100List.innerHTML = `<div class="status error">${error.message}</div>`;
            document.getElementById('mgrName').innerText = '未连接';
            document.getElementById('mgrStyle').innerText = 'SEC EDGAR';
        }
    }

    function renderInstitutionSelector() {
        scrollContainer.innerHTML = '';
        data.forEach((inst, idx) => {
            const chip = document.createElement('div');
            chip.className = `inst-chip ${idx === 0 ? 'active' : ''}`;
            chip.innerText = inst.name;
            chip.onclick = () => switchInstitution(idx);
            scrollContainer.appendChild(chip);
        });
    }

    function switchInstitution(idx) {
        currentIdx = idx;
        // 更新按钮状态
        document.querySelectorAll('.inst-chip').forEach((el, i) => {
            el.classList.toggle('active', i === idx);
        });
        renderView();
    }

    function renderView() {
        const inst = data[currentIdx];
        if (!inst) return;
        
        // 更新元数据
        document.getElementById('mgrName').innerText = inst.mgr;
        document.getElementById('mgrStyle').innerText = inst.style || '13F';
        document.getElementById('filingDate').innerText = inst.reportDate || inst.filingDate || 'SEC EDGAR';

        // 渲染卡片
        grid.innerHTML = ''; // 清空

        inst.holdings.forEach(stock => {
            const card = document.createElement('div');
            card.className = 'stock-card';
            card.innerHTML = `
                <div class="card-header">
                    <div>
                        <div class="ticker">${stock.t}</div>
                        <div class="company-name">${stock.n}</div>
                    </div>
                    <div class="change-badge flat">13F</div>
                </div>
                <div class="card-footer">
                    <span>市值 ${stock.v}</span>
                    <span>占比 ${stock.p}</span>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    function renderTop100Directory(meta) {
        top100List.innerHTML = '';
        if (!top100.length) {
            top100List.innerHTML = '<div class="status">暂无资产管理机构榜单数据。</div>';
            return;
        }

        const table = document.createElement('table');
        table.className = 'directory-table';
        const thead = document.createElement('thead');
        const headerRow = document.createElement('tr');
        ['排名', '机构（中文 / English）', '国家 / 地区', '公开管理规模', '数据状态'].forEach(label => {
            const cell = document.createElement('th');
            cell.innerText = label;
            headerRow.appendChild(cell);
        });
        thead.appendChild(headerRow);
        table.appendChild(thead);

        const tbody = document.createElement('tbody');
        top100.forEach(manager => {
            const row = document.createElement('tr');

            const rank = document.createElement('td');
            rank.className = 'directory-rank';
            rank.innerText = `#${manager.rank}`;
            row.appendChild(rank);

            const name = document.createElement('td');
            const nameZh = document.createElement('span');
            nameZh.className = 'directory-name-zh';
            nameZh.innerText = manager.nameZh || '中文名称待补充';
            const nameEn = document.createElement('span');
            nameEn.className = 'directory-name-en';
            nameEn.innerText = manager.nameEn || '';
            name.append(nameZh, nameEn);
            row.appendChild(name);

            const region = document.createElement('td');
            region.className = 'directory-region';
            region.innerText = `${manager.country || '—'} / ${manager.region || '—'}`;
            row.appendChild(region);

            const aum = document.createElement('td');
            aum.className = 'directory-aum';
            aum.innerText = manager.aumDisplay || '未公开';
            row.appendChild(aum);

            const status = document.createElement('td');
            const badge = document.createElement('span');
            badge.className = `data-badge ${manager.aumDisplay ? 'available' : 'unavailable'}`;
            badge.innerText = manager.aumDisplay ? 'AUM 已公开' : 'AUM 未公开';
            status.appendChild(badge);
            const note = document.createElement('div');
            note.className = 'directory-name-en';
            note.innerText = '点击查询 SEC 13F';
            status.appendChild(note);
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'holding-button';
            button.innerText = '查看持仓比例';
            button.onclick = () => loadManagerHoldings(manager, button);
            status.appendChild(button);
            row.appendChild(status);

            tbody.appendChild(row);
        });
        table.appendChild(tbody);
        top100List.appendChild(table);

        const total = document.getElementById('top100Total');
        total.innerText = `${meta && meta.totalCount ? meta.totalCount : top100.length} 家 · ${meta && meta.totalAssetsDisplay ? meta.totalAssetsDisplay : 'AUM 汇总未提供'}`;
        const source = document.getElementById('top100Source');
        source.innerText = `排名来源：${meta && meta.source ? meta.source : '公开榜单'}；快照日期：${formatDate(meta && meta.asOf)}。AUM 为 USD，未显示数值表示原榜单未公开；中文名称为常用译名/音译，持仓数据仍以 SEC EDGAR 13F 为准。正式公开前请确认榜单转载许可。`;
        if (meta && meta.sourceUrl) {
            const link = document.createElement('a');
            link.href = meta.sourceUrl;
            link.target = '_blank';
            link.rel = 'noreferrer';
            link.innerText = '查看来源';
            source.append(' ', link);
        }
    }

    async function loadManagerHoldings(manager, button) {
        holdingsDetail.hidden = false;
        holdingsTitle.innerText = `${manager.nameZh} / ${manager.nameEn}`;
        holdingsMeta.innerText = '正在查询 SEC EDGAR 最新 13F 报告...';
        holdingsDetailBody.innerHTML = '<div class="status">正在读取真实持仓数据...</div>';
        button.disabled = true;
        holdingsDetail.scrollIntoView({ behavior: 'smooth', block: 'start' });

        try {
            const response = await fetch(`${API_ENDPOINT}/manager-holdings?rank=${encodeURIComponent(manager.rank)}`);
            const payload = await response.json();
            if (!response.ok) {
                throw new Error(payload.error || `SEC 持仓接口返回 ${response.status}`);
            }

            holdingsMeta.innerText = `申报主体 ${payload.filerName || '—'} · 报告期 ${payload.reportDate || '—'} · 提交日期 ${payload.filingDate || '—'} · CIK ${payload.cik}`;
            renderHoldings(payload.holdings || []);
        } catch (error) {
            holdingsMeta.innerText = 'SEC EDGAR';
            holdingsDetailBody.innerHTML = `<div class="status error">${error.message}</div>`;
        } finally {
            button.disabled = false;
        }
    }

    function renderHoldings(holdings) {
        holdingsDetailBody.innerHTML = '';
        if (!holdings.length) {
            holdingsDetailBody.innerHTML = '<div class="status">该申报没有可显示的持仓。</div>';
            return;
        }

        const table = document.createElement('table');
        table.className = 'holdings-table';
        const head = document.createElement('thead');
        const headRow = document.createElement('tr');
        ['Ticker', '证券', '申报市值', '组合占比'].forEach(label => {
            const cell = document.createElement('th');
            cell.innerText = label;
            headRow.appendChild(cell);
        });
        head.appendChild(headRow);
        table.appendChild(head);

        const body = document.createElement('tbody');
        holdings.forEach(stock => {
            const row = document.createElement('tr');
            [stock.t || '—', stock.n || '—', stock.v || '—', stock.p || '0%'].forEach((value, index) => {
                const cell = document.createElement('td');
                cell.innerText = value;
                if (index > 1) cell.style.textAlign = 'right';
                row.appendChild(cell);
            });
            body.appendChild(row);
        });
        table.appendChild(body);
        holdingsDetailBody.appendChild(table);
    }

    function formatDate(value) {
        if (!value) return '—';
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return value;
        return date.toLocaleDateString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit' });
    }

    // 初始化
    loadData();
</script>
</body>
</html>
